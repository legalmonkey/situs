[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "situs"
version = "0.1.0"
description = "Distributed GPU pooling and LLM inference across residential internet"
authors = [{ name = "Situs Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "safetensors",
    "fastapi",
    "uvicorn",
    "websockets",
    "sse-starlette",
    "pydantic>=2.0",
    "numpy",
    "rich",
    "typer",
    "prompt_toolkit>=3.0",
    "zstandard>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[project.scripts]
situs = "situs.cli:main"
situs-coordinator = "situs.coordinator.app:main"
situs-worker = "situs.worker.client:main"
